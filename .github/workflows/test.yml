name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: pip install "pyyaml>=6,<7" "jsonschema>=4.23,<5"

      - name: Plugin copies match shared/
        run: python scripts/sync_shared.py --check

      - run: python -m unittest discover -s tests -v

  # 3.8 is the oldest Python the hooks support. The guard and sync tests use
  # only the standard library, so they run here without installing anything.
  test-py38:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container: python:3.8-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: python -m unittest discover -s tests -p "test_[gs]*.py" -v
