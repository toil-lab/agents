schema_version: 1
name: check-scheduler
team: checks
kind: deployment
image: ghcr.io/toil-lab/check-scheduler
port: 9090
health:
  liveness: /healthz
  readiness: /readyz
resources:
  cpu: 50m
  memory: 32Mi
scaling:
  min: 1
  max: 1
  metric: none
config: [PROBE_INTERVAL]
secrets: [REDIS_URL]
depends_on: [checks-redis, status/status-api]
backing:
  - type: redis
    name: checks-redis
    storage: 1Gi
